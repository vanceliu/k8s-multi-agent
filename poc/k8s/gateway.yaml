apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: agent-platform
  labels:
    app: k8s-agent-platform
    component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-agent-platform
      component: gateway
  template:
    metadata:
      labels:
        app: k8s-agent-platform
        component: gateway
    spec:
      containers:
      - name: gateway
        image: localhost/k8s-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: ORCHESTRATOR_HOST
          value: "http://orchestrator.agent-platform.svc.cluster.local"
        - name: ADMIN_SERVICE_HOST
          value: "http://admin.agent-platform.svc.cluster.local"
        - name: POC_STATIC_TOKEN
          value: "poc-test-token-12345"
        - name: POC_ADMIN_TOKEN
          value: "poc-admin-token-12345"
        - name: STORAGE_SERVICE_HOST
          value: "http://storage-service.agent-platform.svc.cluster.local"
        - name: LINE_CHANNEL_SECRET
          value: ""
        - name: LINE_CHANNEL_ACCESS_TOKEN
          value: ""
        - name: DATABASE_URL
          value: "postgresql+asyncpg://postgres:postgres@host.docker.internal:5432/claw_data"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: agent-platform
  labels:
    app: k8s-agent-platform
    component: gateway
spec:
  type: NodePort
  selector:
    app: k8s-agent-platform
    component: gateway
  ports:
  - name: http
    port: 80
    targetPort: 8000
    nodePort: 30080
    protocol: TCP
