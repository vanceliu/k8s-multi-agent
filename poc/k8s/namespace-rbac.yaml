apiVersion: v1
kind: Namespace
metadata:
  name: agent-platform
  labels:
    app: k8s-agent-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator-sa
  namespace: agent-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orchestrator-role
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["create", "delete", "get", "list", "watch", "patch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["create", "delete", "get", "list", "watch", "patch"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["create", "delete", "get", "list", "watch", "patch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "delete", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orchestrator-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: orchestrator-role
subjects:
- kind: ServiceAccount
  name: orchestrator-sa
  namespace: agent-platform
---
# NetworkPolicy: Agent Pods only accept ingress from Gateway and Storage Service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-allow-gateway-only
  namespace: agent-platform
spec:
  podSelector:
    matchLabels:
      app: k8s-agent-platform
      component: agent
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: k8s-agent-platform
          component: gateway
    - podSelector:
        matchLabels:
          app: k8s-agent-platform
          component: storage-service
---
# NetworkPolicy: Orchestrator accepts ingress from Gateway, Admin, Storage Service, and Agent
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orchestrator-allow-gateway-admin
  namespace: agent-platform
spec:
  podSelector:
    matchLabels:
      app: k8s-agent-platform
      component: orchestrator
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: k8s-agent-platform
          component: gateway
    - podSelector:
        matchLabels:
          app: k8s-agent-platform
          component: admin
    - podSelector:
        matchLabels:
          app: k8s-agent-platform
          component: storage-service
    - podSelector:
        matchLabels:
          app: k8s-agent-platform
          component: agent
---
# NetworkPolicy: Storage Service accepts ingress from Gateway and Orchestrator
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: storage-service-allow-gateway
  namespace: agent-platform
spec:
  podSelector:
    matchLabels:
      app: k8s-agent-platform
      component: storage-service
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: k8s-agent-platform
          component: gateway
    - podSelector:
        matchLabels:
          app: k8s-agent-platform
          component: orchestrator
    - podSelector:
        matchLabels:
          app: k8s-agent-platform
          component: admin
